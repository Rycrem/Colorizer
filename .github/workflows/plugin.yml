name: Plugin

# - À chaque push sur main et chaque pull request : on construit le plugin (vérifie que ça compile).
# - Quand on pousse un tag de version (ex. v1.10.0) : on construit ET on publie sur le JetBrains Marketplace.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew buildPlugin --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/distributions/*.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches the plugin version
        run: |
          VERSION=$(grep -E '^version = ' build.gradle.kts | sed -E 's/version = "(.*)"/\1/')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in build.gradle.kts"
            exit 1
          fi

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew publishPlugin --console=plain
